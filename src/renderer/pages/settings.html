<div class="dropdown-header">Settings</div>

<div class="settings-list">

  <!-- Theme -->
  <div class="setting-item">
    <div class="setting-info">
      <div class="setting-name">Theme</div>
      <div class="setting-desc">Choose appearance</div>
    </div>
    <div class="select-wrap">
      <select id="setting-theme">
        <option value="dark">Dark</option>
        <option value="light">Light</option>
        <option value="system">System</option>
      </select>
    </div>
  </div>

  <!-- Notifications -->
  <div class="setting-item">
    <div class="setting-info">
      <div class="setting-name">Notifications</div>
      <div class="setting-desc">Session completion alerts</div>
    </div>
    <label class="toggle">
      <input type="checkbox" id="setting-notifications" checked />
      <span class="toggle-slider"></span>
    </label>
  </div>

  <!-- Default Timer -->
  <div class="setting-item">
    <div class="setting-info">
      <div class="setting-name">Default Timer</div>
      <div class="setting-desc">Default session length</div>
    </div>
    <div class="select-wrap">
      <select id="setting-default-timer">
        <option value="25">25 min</option>
        <option value="50" selected>50 min</option>
        <option value="90">90 min</option>
      </select>
    </div>
  </div>

</div>
