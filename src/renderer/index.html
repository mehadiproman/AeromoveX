<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FocusFlight</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <!-- Styles (separate file per feature) -->
  <link rel="stylesheet" href="styles/global.css" />
  <link rel="stylesheet" href="styles/timer.css" />
  <link rel="stylesheet" href="styles/history.css" />
  <link rel="stylesheet" href="styles/stats.css" />
  <link rel="stylesheet" href="styles/settings.css" />
</head>
<body>

  <!-- ── Top Bar ── -->
  <header class="top-bar">
    <div class="top-bar-logo">
      <span>✈️</span> FocusFlight
    </div>
    <nav class="top-nav">
      <div class="nav-btn" data-dropdown="history" id="nav-history">History</div>
      <div class="nav-btn" data-dropdown="stats" id="nav-stats">Statistics</div>
      <div class="nav-btn" data-dropdown="settings" id="nav-settings">Settings</div>
    </nav>
  </header>

  <!-- ── Dropdown Panel (opens below top bar) ── -->
  <div class="dropdown-overlay" id="dropdown-overlay">
    <div class="dropdown-panel" id="dropdown-panel">
      <!-- Content loaded dynamically from pages/ -->
    </div>
  </div>

  <!-- ── Main Content: Timer (centered) ── -->
  <main class="main-content">
    <div class="timer-layout">

      <!-- Destination -->
      <div class="timer-section">
        <div class="section-label">Destination</div>
        <div class="destination-selector" id="dest-selector"></div>
      </div>

      <!-- Duration -->
      <div class="timer-section">
        <div class="section-label">Duration</div>
        <div class="timer-presets" id="timer-presets"></div>
      </div>

      <!-- Flight Track -->
      <div class="flight-track-section">
        <div class="flight-labels">
          <div class="flight-label">
            <div class="label-city" id="label-from">Dhaka</div>
            <div class="label-tag">Origin</div>
          </div>
          <div class="flight-label">
            <div class="label-city" id="label-to">Tokyo</div>
            <div class="label-tag">Destination</div>
          </div>
        </div>
        <div class="flight-track">
          <div class="track-line"></div>
          <div class="track-progress" id="track-progress"></div>
          <div class="track-dots" id="track-dots"></div>
          <div class="track-plane" id="track-plane">✈️</div>
        </div>
      </div>

      <!-- Timer -->
      <div class="timer-display">
        <div class="timer-time" id="timer-time">50:00</div>
        <div class="timer-percent" id="timer-percent">0% complete</div>
      </div>

      <!-- Controls -->
      <div class="timer-controls">
        <button class="btn btn-primary" id="btn-start">▶ Start</button>
        <button class="btn" id="btn-pause" disabled>⏸ Pause</button>
        <button class="btn btn-danger" id="btn-reset" disabled>↺ Reset</button>
      </div>

    </div>
  </main>

  <!-- ── Session Complete Modal ── -->
  <div class="modal-overlay" id="modal-overlay">
    <div class="modal">
      <div class="modal-icon">🎉</div>
      <h2>Journey Complete!</h2>
      <p>
        You reached <strong id="modal-dest">—</strong><br />
        Duration: <strong id="modal-duration">—</strong>
      </p>
      <button class="btn btn-primary" id="modal-close">Continue</button>
    </div>
  </div>

  <!-- Scripts -->
  <script src="scripts/timer.js"></script>
  <script src="scripts/history.js"></script>
  <script src="scripts/stats.js"></script>
  <script src="scripts/settings.js"></script>
  <script src="scripts/app.js"></script>

</body>
</html>
